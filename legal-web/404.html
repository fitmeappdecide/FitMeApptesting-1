<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | FitMe</title>
  <meta name="description" content="Page not found on FitMe.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF7F2;
      --card-bg: #FFFFFF;
      --text-main: #1C1917;
      --text-muted: #6B7280;
      --accent: #A96A47;
      --border: #E8E2D9;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .brand-logo {
      font-family: 'Cormorant Garamond', ui-serif, Georgia, serif;
      font-size: 2.25rem;
      font-weight: 300;
      letter-spacing: -0.025em;
      text-decoration: none;
      margin-bottom: 24px;
      display: inline-block;
    }
    .logo-fit { color: var(--text-main); font-style: italic; }
    .logo-me { color: var(--accent); font-weight: 500; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 3rem;
      font-weight: 400;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: var(--text-main);
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 500;
      font-size: 0.95rem;
      transition: opacity 0.15s ease;
    }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="brand-logo" aria-label="FitMe Home">
      <span class="logo-fit">Fit</span><span class="logo-me">Me</span>
    </a>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a href="/" class="btn">Return to Legal Center</a>
  </div>
</body>
</html>
